name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-quality-checks:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v4.3.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Security Audit
        run: bun audit --prod

      - name: Check Types, Lint and Formatting
        run: bun run check

      - name: Build Web Application
        run: bun run build
        env:
          NODE_ENV: production

  verify-status:
    name: Verify Status
    needs: [run-quality-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Quality Checks
        env:
          RESULT: ${{ needs.run-quality-checks.result }}
        run: '[ "$RESULT" = "success" ]'
